[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-control"
version = "1.3.3"
description = "Windows desktop MCP with authenticated, cancellable execution"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dependencies = [
  "mcp>=1.30,<2", "pynput>=1.8,<2", "mss>=10,<11", "Pillow>=11,<14",
  "numpy>=2,<3", "opencv-python>=4.10,<6", "psutil>=6,<8",
  "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
  "pywin32>=306; sys_platform == 'win32'", "uvicorn>=0.30,<1",
  "winrt-Windows.Globalization>=3; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
]

[project.scripts]
icon-control = "computer_mcp.launcher:main"

[tool.setuptools]
package-dir = {computer_mcp = "_patched"}
packages = ["computer_mcp", "computer_mcp.actions", "computer_mcp.core",
 "computer_mcp.dataset", "computer_mcp.dataset.importers", "computer_mcp.zones",
 "computer_mcp.zones.z0_governance", "computer_mcp.zones.z1_capture", "computer_mcp.zones.z2_sense",
 "computer_mcp.zones.z3_act", "computer_mcp.zones.z4_compose", "computer_mcp.zones.z5_memory",
 "computer_mcp.zones.z6_learning"]

[tool.setuptools.data-files]
"share/icon-control/plugin" = ["plugin/client.js", "plugin/index.js", "plugin/package.json", "plugin/cordis.patch.yml", "plugin/icon.svg"]
"share/icon-control/macros" = ["macros/*.json"]
"share/icon-control/recipes" = ["recipes/*.json"]
"share/icon-control/templates" = ["templates/*.png"]

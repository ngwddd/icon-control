name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_artifacts.py
      - name: Install the built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          python -m pip install -c constraints-windows-py312.txt $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
      - name: Regression suite
        shell: pwsh
        run: |
          python tools/verify.py --pattern "test_*.py"
          $code = $LASTEXITCODE
          $report = Get-Content .runtime/test-results.json -Raw | ConvertFrom-Json
          if ($report.failures.Count -ne 0 -or $report.errors.Count -ne 0) { throw 'Regression failures reported' }
          if ($report.run -le $report.skipped.Count) { throw 'Suite skipped everything; not a pass' }
          if ($code -ne 0) { Write-Warning "verify.py exited $code after a green report" }
      - name: Official MCP SDK interoperability
        shell: pwsh
        run: |
          $env:ICON_CONTROL_HOME = Join-Path $pwd '.runtime/protocol'
          $env:DSH_MOUSE_BRIDGE = 'off'
          python -m computer_mcp.launcher init
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture initialization failed' }
          python tools/protocol_smoke.py --home $env:ICON_CONTROL_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Official SDK round trip failed' }
      # Formal stability is gated on SHA-bound acceptance evidence. A tag whose
      # evidence is incomplete may still ship, but only as a pre-release.
      - name: Formal release gate
        id: gate
        continue-on-error: true
        shell: pwsh
        run: python tools/release_gate.py docs/v1.3/acceptance.json --expected-commit $env:GITHUB_SHA
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .runtime/test-results.json
            .runtime/tests.log
            .runtime/protocol/protocol-smoke.json
            dist/*
      - name: Publish stable release
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/* --clobber
            gh release edit "${{ github.ref_name }}" --notes-file docs/v1.3/RELEASE-${{ github.ref_name }}.md
          } else {
            gh release create "${{ github.ref_name }}" dist/* `
              --title "Icon Control ${{ github.ref_name }}" `
              --notes-file docs/v1.3/RELEASE-${{ github.ref_name }}.md
          }
      - name: Publish pre-release
        if: steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/* --clobber
            gh release edit "${{ github.ref_name }}" --notes-file docs/v1.3/RELEASE-${{ github.ref_name }}.md --prerelease
          } else {
            gh release create "${{ github.ref_name }}" dist/* `
              --prerelease `
              --title "Icon Control ${{ github.ref_name }} (pre-release)" `
              --notes-file docs/v1.3/RELEASE-${{ github.ref_name }}.md
          }

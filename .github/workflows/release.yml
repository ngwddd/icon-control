name: Release
on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact release tag matching VERSION'
        required: true
        default: 'v1.4.5'
        type: string
      expected_sha:
        description: 'Exact main commit already validated by Windows CI'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REQUESTED_SHA: ${{ inputs.expected_sha }}
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind release tag to exact source version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME.StartsWith('release/')) {
            $env:RELEASE_TAG = $env:GITHUB_REF_NAME.Substring(8)
            "RELEASE_TAG=$env:RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF_NAME -ne 'main') { throw 'Manual publication must use main' }
            if ($env:REQUESTED_SHA -ne $env:GITHUB_SHA) { throw 'Requested source commit changed' }
          }
          python tools/release_gate.py --expected-tag "$env:RELEASE_TAG" --version-only
          if ($LASTEXITCODE -ne 0) { throw 'Tag/package identity mismatch' }
          if ($env:RELEASE_TAG -match '^v\d+\.\d+\.\d+$') {
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Stable source must be on main' }
          }
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_artifacts.py
      - name: Install and verify the built wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          python -m pip install -c constraints-windows-py312.txt $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inconsistency' }
          python -c "import os,json,importlib.metadata; from pathlib import Path; import computer_mcp; v=Path('VERSION').read_text().strip(); assert computer_mcp.__version__==v; assert importlib.metadata.version('icon-control')==v; b=json.loads(Path(computer_mcp.__file__).with_name('_build_info.json').read_text()); assert b['source_commit']==os.environ['GITHUB_SHA'] and b['source_dirty'] is False, b; print(json.dumps(b))"
          if ($LASTEXITCODE -ne 0) { throw 'Installed package identity mismatch' }
      - run: python tools/snapshot_tools.py --check
      - name: Regression suite
        run: python tools/verify.py --pattern "test_*.py"
      - name: Native window fault and input probe
        run: python tools/rc2_window_probe.py --inject --output .runtime/native-window-report.json
      - name: Official MCP SDK interoperability
        shell: pwsh
        run: |
          $env:ICON_CONTROL_HOME = Join-Path $pwd '.runtime/protocol'
          $env:DSH_MOUSE_BRIDGE = 'off'
          python -m computer_mcp.launcher init
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture initialization failed' }
          python tools/protocol_smoke.py --home $env:ICON_CONTROL_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Official SDK round trip failed' }
      - name: Install upgrade and rollback
        shell: pwsh
        run: |
          git worktree add --detach .runtime/baseline 30cbae7feee4f965812260eda663484384ec363b
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          python -m build --wheel --outdir .runtime/baseline-dist .runtime/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          $baseline = (Get-ChildItem .runtime/baseline-dist -Filter *.whl | Select-Object -First 1).FullName
          $candidate = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          python tools/rc2_install_probe.py --baseline-wheel $baseline --candidate-wheel $candidate --output .runtime/install-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Installation migration failed' }
      - name: Formal release gate
        shell: pwsh
        run: |
          python tools/release_gate.py --expected-commit $env:GITHUB_SHA --expected-tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release evidence rejected; nothing will be published' }
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .runtime/test-results.json
            .runtime/tests.log
            .runtime/protocol/protocol-smoke.json
            .runtime/native-window-report.json
            .runtime/install-report.json
            dist/*
      - name: Create verified tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "docs/v1.4/RELEASE-$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Version-specific release notes missing' }
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed' }
          } elseif ($existing -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit' }
          $resolved = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $resolved -ne $env:GITHUB_SHA) { throw 'Published tag identity mismatch' }
          gh release view "$tag" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; automatic asset replacement is forbidden' }
          if ($tag -match '(?i)rc') {
            gh release create "$tag" dist/* --verify-tag --prerelease --latest=false --title "Icon Control $tag" --notes-file "$notes"
          } else {
            gh release create "$tag" dist/* --verify-tag --latest --title "Icon Control $tag" --notes-file "$notes"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

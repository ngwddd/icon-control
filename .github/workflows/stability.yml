name: Stability candidate validation
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_artifacts.py
      - shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          python -m pip install -c constraints-windows-py312.txt $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
      - run: python -m pip check
      - name: Verify installed wheel provenance
        shell: pwsh
        run: |
          python -c "import json,os; from pathlib import Path; import computer_mcp; p=Path(computer_mcp.__file__).with_name('_build_info.json'); b=json.loads(p.read_text()); assert b['source_commit']==os.environ['GITHUB_SHA'], b; assert b['source_dirty'] is False, b; assert computer_mcp.__version__==Path('VERSION').read_text().strip(); print(json.dumps(b))"
          if ($LASTEXITCODE -ne 0) { throw 'Wheel provenance mismatch' }
      - run: python tools/snapshot_tools.py --check
      - run: python tools/verify.py --pattern "test_*.py"
      - name: Native HWND faults and fixture click
        if: ${{ !cancelled() }}
        run: python tools/rc2_window_probe.py --inject --output .runtime/native-window-report.json
      - name: Official MCP SDK interoperability
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:ICON_CONTROL_HOME = Join-Path $pwd '.runtime/protocol'
          $env:DSH_MOUSE_BRIDGE = 'off'
          python -m computer_mcp.launcher init
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture initialization failed' }
          python tools/protocol_smoke.py --home $env:ICON_CONTROL_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Official SDK round trip failed' }
      - name: Install upgrade and rollback with pending stop
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          git worktree add --detach .runtime/baseline 30cbae7feee4f965812260eda663484384ec363b
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          python -m build --wheel --outdir .runtime/baseline-dist .runtime/baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline wheel build failed' }
          $baseline = (Get-ChildItem .runtime/baseline-dist -Filter *.whl | Select-Object -First 1).FullName
          $candidate = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          python tools/rc2_install_probe.py --baseline-wheel $baseline --candidate-wheel $candidate --output .runtime/install-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Installer integration failed' }
      - name: Candidate automated evidence gate
        shell: pwsh
        run: |
          python tools/release_gate.py --expected-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Candidate evidence gate failed' }
          Get-ChildItem -LiteralPath dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: |
            .runtime/test-results.json
            .runtime/tests.log
            .runtime/protocol/protocol-smoke.json
            .runtime/native-window-report.json
            .runtime/install-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: icon-control-candidate
          path: dist/*
      # Formal releases require manual S5 desktop acceptance; this workflow
      # never tags or publishes v1.3.0 automatically.
